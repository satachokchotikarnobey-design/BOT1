
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAZA SHOP · ตั้งค่าไฮไลท์ & สไนเปอร์</title>
    <!-- Font Awesome 6 (ฟรี) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background: #f0f4fa;
            color: #1e2a41;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app {
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            border-radius: 40px 40px 30px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            padding: 28px 32px 40px;
            transition: all 0.2s;
        }

        /* HEADER */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eef3f8;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand i {
            font-size: 2.4rem;
            color: #2a6df4;
            background: #e6edfe;
            padding: 12px;
            border-radius: 20px;
            box-shadow: 0 4px 8px rgba(42, 109, 244, 0.15);
        }

        .brand h1 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            background: linear-gradient(145deg, #1a2e4a, #2a6df4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand span {
            font-weight: 300;
            font-size: 0.95rem;
            color: #5b6f87;
            display: block;
            margin-top: 2px;
            -webkit-text-fill-color: #5b6f87;
            background: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .points-box {
            background: #f0f5fe;
            padding: 8px 22px 8px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 1rem;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
            border: 1px solid #d9e4f0;
        }

        .points-box i {
            color: #fbbf24;
            font-size: 1.4rem;
        }

        .points-box .pts-num {
            background: #1e2a41;
            color: white;
            padding: 0 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            line-height: 28px;
            min-width: 48px;
            text-align: center;
        }

        .cart-icon {
            position: relative;
            font-size: 1.7rem;
            color: #2a4b7a;
            background: #eef3f8;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            transition: 0.15s;
            cursor: pointer;
            border: none;
        }

        .cart-icon:hover {
            background: #dce6f0;
            transform: scale(1.03);
        }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #e53e3e;
            color: white;
            font-size: 0.7rem;
            font-weight: 600;
            width: 24px;
            height: 24px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(229, 62, 62, 0.3);
        }

        /* TOAST */
        .toast {
            position: fixed;
            top: 25px;
            right: 25px;
            background: #1e2a41;
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 500;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            transform: translateY(-20px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 999;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            font-size: 1.2rem;
            color: #fbbf24;
        }

        /* เนื้อหาหลัก */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1.2fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* สินค้า */
        .product-section h2 {
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-section h2 i {
            color: #2a6df4;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .product-card {
            background: #f8fafd;
            border-radius: 28px;
            padding: 20px 16px 18px;
            border: 1px solid #e6edf5;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            border-color: #b8cee8;
            box-shadow: 0 8px 18px rgba(0, 20, 40, 0.06);
            transform: translateY(-2px);
        }

        .product-card .icon-wrap {
            font-size: 2.2rem;
            color: #2a6df4;
            background: #e6edfe;
            width: 60px;
            height: 60px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .product-card h3 {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .product-card .desc {
            font-size: 0.85rem;
            color: #5b6f87;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .product-card .price {
            font-weight: 700;
            font-size: 1.2rem;
            color: #1a2e4a;
            margin-top: auto;
            margin-bottom: 14px;
        }

        .product-card .price small {
            font-weight: 400;
            font-size: 0.75rem;
            color: #6f86a0;
            margin-left: 4px;
        }

        .btn-add {
            background: #1e2a41;
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 0;
            border-radius: 40px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Prompt', sans-serif;
        }

        .btn-add:hover {
            background: #2a6df4;
            transform: scale(1.02);
        }

        /* ตะกร้า + ToonMoney */
        .cart-side {
            background: #f8fafd;
            border-radius: 32px;
            padding: 24px 22px;
            border: 1px solid #e6edf5;
            height: fit-content;
        }

        .cart-side h2 {
            font-weight: 600;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .cart-items {
            list-style: none;
            margin-bottom: 16px;
            max-height: 270px;
            overflow-y: auto;
        }

        .cart-items li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e2eaf2;
            font-size: 0.95rem;
        }

        .cart-items li:last-child {
            border-bottom: none;
        }

        .cart-item-info {
            display: flex;
            flex-direction: column;
        }

        .cart-item-name {
            font-weight: 500;
        }

        .cart-item-sub {
            font-size: 0.75rem;
            color: #6f86a0;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-actions button {
            background: transparent;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
            background: #e6edf5;
            color: #1e2a41;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item-actions button:hover {
            background: #cbdae8;
        }

        .cart-item-actions .qty {
            min-width: 24px;
            text-align: center;
            font-weight: 600;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            font-size: 1.2rem;
            padding-top: 12px;
            border-top: 2px solid #dce4ef;
            margin: 12px 0 18px;
        }

        .btn-checkout {
            width: 100%;
            background: #2a6df4;
            border: none;
            color: white;
            font-weight: 600;
            padding: 14px 0;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Prompt', sans-serif;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-checkout:hover {
            background: #1a56c9;
            transform: scale(1.01);
        }

        /* ToonMoney */
        .toon-box {
            background: #eef4fc;
            border-radius: 28px;
            padding: 18px 20px 20px;
            border: 1px solid #d2e0f0;
        }

        .toon-box h3 {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .toon-box h3 i {
            color: #fbbf24;
        }

        .toon-input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toon-input-group input {
            flex: 2;
            min-width: 120px;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1px solid #cdddee;
            font-family: 'Prompt', sans-serif;
            font-size: 0.95rem;
            background: white;
            outline: none;
            transition: 0.15s;
        }

        .toon-input-group input:focus {
            border-color: #2a6df4;
            box-shadow: 0 0 0 3px rgba(42, 109, 244, 0.15);
        }

        .toon-input-group button {
            flex: 1;
            min-width: 80px;
            background: #1e2a41;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 18px;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            font-family: 'Prompt', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toon-input-group button:hover {
            background: #2a6df4;
        }

        .toon-hint {
            font-size: 0.8rem;
            color: #4b6380;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .empty-cart {
            color: #6f86a0;
            text-align: center;
            padding: 20px 0;
        }

        /* responsive */
        @media (max-width: 600px) {
            .app {
                padding: 16px;
            }
            .header {
                flex-direction: column;
                align-items: start;
                gap: 15px;
            }
            .header-actions {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <i class="fas fa-store"></i>
                <div>
                    <h1>ZAZA SHOP</h1>
                    <span>ตั้งค่าไฮไลท์ · สไนเปอร์</span>
                </div>
            </div>
            <div class="header-actions">
                <div class="points-box">
                    <i class="fas fa-coins"></i>
                    <span>พอยท์</span>
                    <span class="pts-num" id="pointsDisplay">0</span>
                </div>
                <button class="cart-icon" id="cartToggle" onclick="showToast('🛒 ตะกร้าสินค้าอยู่ด้านขวามือ')">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </header>

        <!-- TOAST -->
        <div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMessage">เพิ่มแล้ว</span></div>

        <!-- MAIN -->
        <div class="main-grid">
            <!-- สินค้า -->
            <section class="product-section">
                <h2><i class="fas fa-bolt"></i> แพ็กเกจตั้งค่า</h2>
                <div class="product-grid" id="productList">
                    <!-- สินค้าถูกสร้างผ่าน JS -->
                </div>
                <!-- แสดงเพิ่มเติม -->
                <div style="margin-top: 8px; font-size:0.9rem; color:#5b6f87; display:flex; gap:18px; flex-wrap:wrap;">
                    <span><i class="fas fa-check-circle" style="color:#2a6df4;"></i> ตั้งค่าไฮไลท์</span>
                    <span><i class="fas fa-crosshairs" style="color:#2a6df4;"></i> ตั้งค่าสไนเปอร์</span>
                </div>
            </section>

            <!-- ตะกร้า + ToonMoney -->
            <aside class="cart-side">
                <h2><i class="fas fa-shopping-cart"></i> ตะกร้าของฉัน</h2>
                <ul class="cart-items" id="cartItems">
                    <li class="empty-cart">ยังไม่มีสินค้า</li>
                </ul>
                <div class="cart-total">
                    <span>รวม</span>
                    <span id="cartTotal">0 ฿</span>
                </div>
                <button class="btn-checkout" onclick="checkout()">
                    <i class="fas fa-credit-card"></i> สั่งซื้อเลย
                </button>

                <!-- ToonMoney -->
                <div class="toon-box">
                    <h3><i class="fas fa-envelope"></i> ใส่ซอง ToonMoney</h3>
                    <div class="toon-input-group">
                        <input type="number" id="toonAmount" placeholder="จำนวนเงิน (฿)" min="1" value="100">
                        <button onclick="redeemToon()"><i class="fas fa-gift"></i> รับพอยท์</button>
                    </div>
                    <div class="toon-hint">
                        <i class="fas fa-info-circle"></i> รับพอยท์ 1% ของยอดซอง (ขั้นต่ำ 1 พอยท์)
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // --- DATA สินค้า ---
        const products = [
            { id: 1, name: 'ไฮไลท์ เบสิก', desc: 'ตั้งค่าไฮไลท์พื้นฐาน 3 รายการ', price: 99, icon: 'fa-highlighter', type: 'highlight' },
            { id: 2, name: 'ไฮไลท์ โปร', desc: 'ไฮไลท์ไม่จำกัด + ดีไซน์พิเศษ', price: 199, icon: 'fa-star', type: 'highlight' },
            { id: 3, name: 'สไนเปอร์ แท็คติค', desc: 'ตั้งค่าสไนเปอร์ 5 ช่อง + ระบบแจ้งเตือน', price: 149, icon: 'fa-crosshairs', type: 'sniper' },
            { id: 4, name: 'สไนเปอร์ อัลติเมท', desc: 'สไนเปอร์ 10 ช่อง + วิเคราะห์ตลาด', price: 279, icon: 'fa-bullseye', type: 'sniper' }
        ];

        // --- STATE ---
        let cart = []; // { id, name, price, quantity }
        let points = 0;

        // DOM refs
        const productListEl = document.getElementById('productList');
        const cartItemsEl = document.getElementById('cartItems');
        const cartTotalEl = document.getElementById('cartTotal');
        const cartBadge = document.getElementById('cartBadge');
        const pointsDisplay = document.getElementById('pointsDisplay');
        const toastEl = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');

        // --- RENDER สินค้า ---
        function renderProducts() {
            productListEl.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="icon-wrap"><i class="fas ${p.icon}"></i></div>
                    <h3>${p.name}</h3>
                    <div class="desc">${p.desc}</div>
                    <div class="price">${p.price} <small>฿</small></div>
                    <button class="btn-add" onclick="addToCart(${p.id})">
                        <i class="fas fa-plus-circle"></i> หยิบใส่ตะกร้า
                    </button>
                </div>
            `).join('');
        }

        // --- CART FUNCTIONS ---
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            const exist = cart.find(item => item.id === id);
            if (exist) {
                exist.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            showToast(`✅ เพิ่ม ${product.name} ลงตะกร้า`);
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            const newQty = item.quantity + delta;
            if (newQty <= 0) {
                cart = cart.filter(i => i.id !== id);
            } else {
                item.quantity = newQty;
            }
            updateCartUI();
        }

        function updateCartUI() {
            // badge
            const totalItems = cart.reduce((sum, i) => sum + i.quantity, 0);
            cartBadge.textContent = totalItems;

            // รายการ
            if (cart.length === 0) {
                cartItemsEl.innerHTML = `<li class="empty-cart">🛒 ตะกร้าว่าง</li>`;
            } else {
                cartItemsEl.innerHTML = cart.map(item => `
                    <li>
                        <div class="cart-item-info">
                            <span class="cart-item-name">${item.name}</span>
                            <span class="cart-item-sub">${item.price} ฿ × ${item.quantity}</span>
                        </div>
                        <div class="cart-item-actions">
                            <button onclick="changeQty(${item.id}, -1)"><i class="fas fa-minus"></i></button>
                            <span class="qty">${item.quantity}</span>
                            <button onclick="changeQty(${item.id}, 1)"><i class="fas fa-plus"></i></button>
                        </div>
                    </li>
                `).join('');
            }

            // ยอดรวม
            const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
            cartTotalEl.textContent = total + ' ฿';
        }

        // --- CHECKOUT ---
        function checkout() {
            if (cart.length === 0) {
                showToast('⚠️ ตะกร้าว่าง กรุณาเลือกสินค้าก่อน');
                return;
            }
            const total = cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
            // ใช้พอยท์ลด 10% (ตัวอย่าง)
            const discount = Math.min(points, total * 0.1);
            const finalPrice = total - discount;
            showToast(`🎉 สั่งซื้อสำเร็จ! รวม ${total} ฿ ใช้พอยท์ ${Math.floor(discount)} ฿ เหลือจ่าย ${finalPrice} ฿`);
            // ล้างตะกร้า (แต่ไม่ลบพอยท์)
            cart = [];
            updateCartUI();
            // อัปเดตพอยท์ (หักพอยท์ที่ใช้)
            points = points - Math.floor(discount);
            if (points < 0) points = 0;
            updatePointsUI();
        }

        // --- TOONMONEY REDEEM ---
        function redeemToon() {
            const input = document.getElementById('toonAmount');
            let amount = parseFloat(input.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('⚠️ กรุณากรอกจำนวนเงินที่ถูกต้อง');
                return;
            }
            // รับพอยท์ 1% ของยอดซอง (ขั้นต่ำ 1)
            let earned = Math.floor(amount * 0.01);
            if (earned < 1) earned = 1;
            points += earned;
            updatePointsUI();
            showToast(`🎁 รับพอยท์ ${earned} พอยท์ จากซอง ${amount} ฿`);
            input.value = '';
        }

        function updatePointsUI() {
            pointsDisplay.textContent = points;
        }

        // --- TOAST ---
        let toastTimeout;

        function showToast(msg) {
            toastMsg.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2600);
        }

        // --- INIT ---
        renderProducts();
        updateCartUI();
        updatePointsUI();

        // (Optional) คลิกที่ตะกร้าเลื่อนไปที่ side
        document.getElementById('cartToggle').addEventListener('click', () => {
            document.querySelector('.cart-side').scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
```
